<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_BUSINESS_NAME% — Where Every Path Leads to a Story</title>
    <meta name="description" content="%VITE_BUSINESS_NAME% offers curated trek packages, holiday tours and pilgrimage trips across Himachal Pradesh, Rajasthan & Uttarakhand. Complete fleet of cabs & travellers with local expert guides.">
    <meta name="keywords" content="Himachal treks, Hampta Pass, Spiti Valley, Rajasthan tour, Char Dham Yatra, holiday packages India, tempo traveller Himachal, Manali trek, Triund trek">
    <meta name="author" content="%VITE_BUSINESS_NAME%">
    <meta name="theme-color" content="#1a2318">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="%VITE_BUSINESS_NAME% — Where Every Path Leads to a Story">
    <meta property="og:description" content="Curated trek packages, holiday tours & pilgrimage trips across Himachal Pradesh, Rajasthan & Uttarakhand. Complete fleet with local expert guides.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=80">
    <meta property="og:url" content="%VITE_SITE_URL%">
    <meta property="og:site_name" content="%VITE_BUSINESS_NAME%">
    <meta property="og:locale" content="en_IN">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="%VITE_BUSINESS_NAME% — Where Every Path Leads to a Story">
    <meta name="twitter:description" content="Curated trek packages, holiday tours & pilgrimage trips across Himachal Pradesh, Rajasthan & Uttarakhand.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=80">

    <link rel="canonical" href="%VITE_SITE_URL%">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Structured Data (LocalBusiness) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "%VITE_BUSINESS_NAME%",
      "description": "Curated trek packages, holiday tours and pilgrimage trips across Himachal Pradesh, Rajasthan and Uttarakhand.",
      "url": "%VITE_SITE_URL%",
      "telephone": "%VITE_PHONE_DISPLAY%",
      "email": "%VITE_EMAIL%",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Himachal Pradesh",
        "addressCountry": "IN"
      },
      "areaServed": ["Himachal Pradesh", "Rajasthan", "Uttarakhand"],
      "priceRange": "$$"
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
